<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Instalar App</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            background: #f9fafb;
        }
        .card {
            background: white;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 320px;
        }
        .logo {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, #4F46E5, #4338CA);
            border-radius: 20px;
            margin: 0 auto 20px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        svg { width: 40px; height: 40px; }
        h1 { margin: 0 0 8px; color: #1f2937; }
        p { color: #6b7280; margin: 0 0 24px; }
        .btn {
            background: #4F46E5;
            color: white;
            border: none;
            padding: 14px 32px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            width: 100%;
        }
        .btn:hover { background: #4338CA; }
        .note { margin-top: 20px; font-size: 12px; color: #9ca3af; }
    </style>
</head>
<body>
    <div class="card">
        <div class="logo">
            <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2">
                <circle cx="12" cy="12" r="10"/>
                <polyline points="12 6 12 12 16 14"/>
            </svg>
        </div>
        <h1>Diárias</h1>
        <p>Instale o app na tela inicial para uma melhor experiência</p>
        <button class="btn" id="installBtn" style="display:none">
            Instalar App
        </button>
        <p id="status" class="note"></p>
    </div>

    <script>
        let deferredPrompt;
        
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            document.getElementById('installBtn').style.display = 'block';
        });
        
        document.getElementById('installBtn').addEventListener('click', async () => {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                const { outcome } = await deferredPrompt.userChoice;
                document.getElementById('status').textContent = outcome === 'accepted' ? 'Instalado!' : 'Instalação cancelada';
                deferredPrompt = null;
            }
        });
        
        window.addEventListener('appinstalled', () => {
            document.getElementById('installBtn').style.display = 'none';
            document.getElementById('status').textContent = 'App instalado com sucesso!';
        });
    </script>
</body>
</html>
